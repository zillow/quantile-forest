[project]
name = "quantile-forest"
description = "Fast, scikit-learn-compatible quantile regression forests for prediction intervals and uncertainty estimation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Zillow Group AI Team" }]
maintainers = [{ name = "Zillow Group AI Team" }]
dynamic = ["version"]

dependencies = [
    "numpy>=1.24.1",
    "scipy>=1.10.0",
    "scikit-learn>=1.9",
]

keywords = [
    "quantile regression forests",
    "quantile regression",
    "random forest",
    "prediction intervals",
    "uncertainty quantification",
    "uncertainty estimation",
    "conformal prediction",
    "probabilistic forecasting",
    "distributional regression",
    "multi-target regression",
    "regression",
    "machine learning",
    "scikit-learn",
    "sklearn",
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Documentation = "https://zillow.github.io/quantile-forest"
Source = "https://github.com/zillow/quantile-forest"
Tracker = "https://github.com/zillow/quantile-forest/issues"

[build-system]
requires = [
    "setuptools",
    "wheel",
    "Cython>=3.1",
    "numpy>=1.24.1",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "quantile_forest.__version__" }

[tool.black]
line-length = 99
preview = true

[tool.cython-lint]
ignore = ["E741"]
max-line-length = 99

[tool.isort]
force_grid_wrap = 0
include_trailing_comma = true
line_length = 99
multi_line_output = 3
use_parentheses = true
