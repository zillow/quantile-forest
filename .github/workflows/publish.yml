name: publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - 'pyproject.toml'
      - 'setup.py'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-* cp314-* cp315-*
          CIBW_SKIP: '*i686* *win32 *musllinux*'
          CIBW_PROJECT_REQUIRES_PYTHON: '>=3.11,<3.16'
          CIBW_ARCHS_LINUX: auto64
          CIBW_ARCHS_MACOS: x86_64 universal2 arm64
          CIBW_ARCHS_WINDOWS: auto64
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest --pyargs quantile_forest

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
      name: Build source distribution
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7

        - uses: actions/setup-python@v7
          name: Install Python
          with:
            python-version: '3.15'

        - name: Install uv
          run: pip install uv

        - name: Create virtual environment
          run: uv venv
          shell: bash

        - name: Install build
          run: uv pip install build

        - name: Build sdist
          run: uv run python -m build --sdist

        - uses: actions/upload-artifact@v7
          with:
            name: artifact-source
            path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Upload with PyPI's Trusted Publishing, which needs no stored token.
    permissions:
      id-token: write

    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.3
        # To test, uncomment the following (TestPyPI needs its own Trusted Publisher):
        # with:
        #   repository-url: https://test.pypi.org/legacy/
